<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sb-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Bridge Arch Nodes -->
  <path d="M12 44 C22 22, 42 22, 52 44" stroke="url(#sb-grad)" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Interconnected Neural Nodes -->
  <line x1="20" y1="36" x2="32" y2="20" stroke="url(#sb-glow)" stroke-width="2.5" stroke-dasharray="2 2" />
  <line x1="32" y1="20" x2="44" y2="36" stroke="url(#sb-glow)" stroke-width="2.5" stroke-dasharray="2 2" />
  <line x1="12" y1="44" x2="52" y2="44" stroke="#334155" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Node Circles -->
  <circle cx="12" cy="44" r="4.5" fill="#4f46e5" />
  <circle cx="52" cy="44" r="4.5" fill="#06b6d4" />
  <circle cx="32" cy="20" r="5.5" fill="url(#sb-glow)" />
  <circle cx="20" cy="36" r="3.5" fill="#818cf8" />
  <circle cx="44" cy="36" r="3.5" fill="#38bdf8" />
  
  <!-- Center Star/Sparkle -->
  <circle cx="32" cy="20" r="2" fill="#ffffff" />
</svg>
